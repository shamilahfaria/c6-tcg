<!doctype html>
<meta charset="utf-8">
<title>Gauntlet TCG</title>
<link rel="stylesheet" href="holo.css">
<style>
  body { margin: 0; padding: 10px 10px 40px; background: #151820; color: #eee; font: 15px/1.3 system-ui, sans-serif; text-align: center; }
  h1 { font-size: 56px; margin: 60px 0 16px; }
  .big { font-size: 22px; padding: 12px 36px; border: 0; border-radius: 8px; background: #ffcc33; cursor: pointer; }
  .row { display: flex; justify-content: center; align-items: center; gap: 24px; flex-wrap: wrap; margin: 8px 0; }
  .board .active { zoom: .82; }
  .bench { display: flex; gap: 8px; }
  .mini { zoom: .5; }
  .log { min-height: 1.5em; font-size: 20px; margin: 12px; } .log small { display: block; font-size: 13px; color: #777; }
  .who { color: #888; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; }
  .pickable { cursor: pointer; }
  .n { position: absolute; top: -10px; left: -10px; width: 28px; height: 28px; border-radius: 50%; background: #ffcc33; color: #000; display: grid; place-items: center; z-index: 9; }

  /* card face */
  .card { position: relative; }
  .face { height: 100%; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: left; color: #222;
    background: linear-gradient(160deg, var(--c1), var(--c2)); border: 8px solid #f3e9b8; border-radius: inherit; }
  .card.fire     { --c1: #ffb26b; --c2: #e0442e; }
  .card.water    { --c1: #8fd8ff; --c2: #1e7fd8; }
  .card.grass    { --c1: #b8ee8c; --c2: #3f9e3a; }
  .card.electric { --c1: #fff3a0; --c2: #e8b800; }
  .card.psychic  { --c1: #e2b6ff; --c2: #8a3fc8; }
  .card.fighting { --c1: #f0c8a0; --c2: #a86428; }
  .card.normal   { --c1: #e8e8f0; --c2: #8c8ca8; }
  .hd { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; white-space: nowrap; } .hd span + span { font-size: 12px; }
  .bar { height: 6px; background: #0003; border-radius: 3px; } .bar i { display: block; height: 100%; background: #2ecc40; border-radius: 3px; }
  .pic { width: 100%; height: 120px; border-radius: 6px; background: #fff6; border: 3px solid #fff8; box-sizing: border-box; display: grid; place-items: center;
    font-size: 40px; font-weight: 800; position: relative; overflow: hidden; }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
  .full .pic { height: 96px; }
  .face { overflow: hidden; }
  .real { font-size: 10px; color: #444; text-align: right; }
  .ex { font-size: 11px; font-style: italic; color: #b8860b; margin-left: 3px; }
  .energy { letter-spacing: -2px; }
  .cost { font-size: 11px; letter-spacing: -1px; margin-right: 4px; }
  .board { max-width: 1100px; margin: 0 auto; }
  .status { color: #aaa; font-size: 13px; margin: 6px; text-transform: uppercase; letter-spacing: .08em; }
  .status b { color: #ffcc33; letter-spacing: 0; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .acts button, .acts .dis { font: 12px system-ui; padding: 4px 8px; border-radius: 6px; border: 0; background: #ffcc33; cursor: pointer; }
  .acts .dis { background: #333; color: #777; cursor: default; }
  .hand { display: flex; justify-content: center; align-items: flex-start; gap: 6px; flex-wrap: wrap; margin: 4px auto 0; padding: 6px; border-top: 1px solid #333; }
  .trainer { width: 120px; min-height: 80px; box-sizing: border-box; padding: 8px; border-radius: 8px; text-align: left; color: #111; background: #e8e2c8; border: 4px solid #d8cfa8; font-size: 12px; }
  .trainer.supporter { background: #ffd9a8; border-color: #e5b878; }
  .trainer b { display: block; font-size: 13px; } .trainer small { color: #666; text-transform: uppercase; font-size: 9px; letter-spacing: .1em; }
  .trainer p { margin: 4px 0 0; }
  .trainer img { display: block; width: 100%; height: 72px; object-fit: cover; object-position: 50% 25%; border-radius: 4px; margin-bottom: 4px; } .pickable.trainer:hover { outline: 3px solid #ffcc33; }
  .zone { position: fixed; right: 16px; bottom: 16px; background: #22262f; border: 1px solid #444; border-radius: 12px; padding: 10px 14px; text-align: left; font-size: 13px; color: #aaa; }
  .zone .cur { font-size: 34px; line-height: 1; color: #fff; }
  .zone .dim { opacity: .35; }
  .typepick button { font: 18px system-ui; margin: 6px; padding: 12px 18px; border-radius: 10px; border: 3px solid transparent; background: #2a2f3a; color: #eee; cursor: pointer; }
  .typepick button.on { border-color: #ffcc33; background: #3a3520; }
  .log { min-height: 3.6em; font-size: 17px; margin: 4px; } .log small { font-size: 12px; }
  .over h1 { margin-top: 120px; }
  .type { font-size: 12px; text-align: center; margin-top: -2px; }
  .atk { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 5px 8px; border: 0; border-radius: 6px;
    background: #fff9; font: inherit; width: 100%; text-align: left; }
  .atk small { display: block; font-size: 10px; color: #555; }
  button.atk { cursor: pointer; } button.atk:hover:not(:disabled) { background: #fff; } button.atk:disabled { opacity: .5; cursor: default; }
  .weak { font-size: 11px; }
  .alt { background: #8fd8ff; }
  .hint { color: #888; font-size: 13px; } .hint a { color: #ffcc33; }
  .op { opacity: .9; }
  .flavor { font-size: 11px; font-style: italic; color: #333; margin-top: auto; }
</style>

<div id="app"></div>

<script src="cards.js"></script>
<script src="battle.js"></script>
<script>
const app = document.getElementById("app");
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.slice().sort(() => Math.random() - .5); // ponytail: biased shuffle, fine for 20 cards
const icon = t => TYPES[t].icon;
const typeOf = t => `${icon(t)} ${TYPES[t].label}`;
const moves = c => [COMMON[c.type], c.sig];
const pips = (cost, t) => icon(t).repeat(cost.t || 0) + "⚪".repeat(cost.c || 0);
const dots = n => "●".repeat(n) + "○".repeat(Math.max(0, 3 - n));
let G;

// ---------- rendering ----------
// o: { cls, onclick, badge, attack (render moves as buttons), busy, full (show flavor), extra (html under the card) }
function cardHTML(c, o = {}) {
  const max = c.max || c.hp, energy = c.energy || [];
  const initials = c.name.split(" ").map(w => w[0]).join("").slice(0, 2);
  const rows = moves(c).map((m, i) => {
    const rider = [m.flip ? "🪙 coin flip" : "", m.text || ""].filter(Boolean).join(" · ");
    const inner = `<span><span class="cost">${pips(m.cost, c.type)}</span>${m.name}${rider ? `<small>${rider}</small>` : ""}</span><b>${m.dmg}</b>`;
    const ok = o.attack && !o.busy && canPay(c, m.cost);
    return o.attack ? `<button class="atk" onclick="attack(${i})" ${ok ? "" : "disabled"}>${inner}</button>` : `<div class="atk">${inner}</div>`;
  }).join("");
  return `<div class="card ${c.type} ${o.cls || ""} ${o.full ? "full" : ""}" ${o.onclick ? `onclick="${o.onclick}"` : ""}>
    ${o.badge ? `<b class="n">${o.badge}</b>` : ""}
    <div class="card__rotator">
      <div class="card__front"><div class="face">
        <div class="hd"><span>${c.name}${c.ex ? `<em class="ex">ex</em>` : ""}</span><span>${c.hp}/${max} HP</span></div>
        <div class="bar"><i style="width:${c.hp / max * 100}%"></i></div>
        <div class="pic">${initials}${c.photo ? `<img src="${c.photo}" alt="" onerror="this.remove()">` : ""}</div>
        <div class="type">${typeOf(c.type)} <span class="energy">${energy.map(icon).join("")}</span></div>
        ${rows}
        <div class="weak">weak to ${icon(WEAK[c.type])} +20 · retreat ${"⚪".repeat(c.retreat ?? 1) || "free"}</div>
        ${o.full ? `<div class="flavor">${c.flavor}</div><div class="real">${c.real}</div>` : ""}
      </div></div>
      <div class="card__shine"></div>
      <div class="card__glare"></div>
    </div>
  </div>`;
}
function trainerHTML(t, o = {}) {
  return `<div class="trainer ${t.kind} ${t.staff ? "staff" : ""} ${o.cls || ""}" ${o.onclick ? `onclick="${o.onclick}"` : ""}>${t.photo ? `<img src="${t.photo}" alt="">` : ""}<b>${t.name}</b><small>${t.staff ? "staff · " : ""}${t.kind}</small><p>${t.text}</p></div>`;
}
function handHTML(s, mine) {
  return s.hand.map((c, i) => c.sig
    ? cardHTML(c, { cls: "mini" + (mine ? " pickable" : ""), onclick: mine ? `playCard(${i})` : "" })
    : trainerHTML(c, { cls: mine ? "pickable" : "", onclick: mine ? `playCard(${i})` : "" })).join("");
}

function title() {
  app.innerHTML = `<h1>Gauntlet TCG</h1><p>Cohort 6 as a card game, Pokémon TCG Pocket rules. 20-card decks, an Energy Zone, 3 points to win.</p>
    <p><button class="big" onclick="typePick()">Play</button> &nbsp; <button class="big alt" onclick="binder()">Find your card</button></p>
    <p class="hint">${CARDS.length} people · ${TRAINERS.length} trainers · hover to tilt</p>`;
}
function binder() {
  app.innerHTML = `<h2>The Binder</h2><p class="hint"><a href="#" onclick="title();return false">← Back</a> · ${CARDS.length} people in Guess Who order, then trainers</p>
    <div class="row">${CARDS.map(c => cardHTML(c, { full: true })).join("")}</div><div class="row">${TRAINERS.map(t => trainerHTML(t)).join("")}</div>`;
}
let picked = [];
function typePick() {
  picked = [];
  renderTypePick();
}
function renderTypePick() {
  const n = CARDS.filter(c => picked.includes(c.type)).length;
  app.innerHTML = `<h2>Build your deck: pick 1 or 2 energy types</h2><p class="hint">Your Energy Zone only makes these types. Every deck is 12 people + 8 trainers: your types first, ⭐ Staff cards fill the rest.</p>
    <div class="typepick">${Object.keys(TYPES).filter(t => t !== "normal").map(t => `<button class="${picked.includes(t) ? "on" : ""}" onclick="togglePick('${t}')">${typeOf(t)} <small>(${CARDS.filter(c => c.type === t).length})</small></button>`).join("")}</div>
    <p><button class="big" onclick="start()" ${picked.length ? "" : "disabled"}>Shuffle up & play${picked.length ? ` (${n} people)` : ""}</button></p>`;
}
function togglePick(t) {
  picked = picked.includes(t) ? picked.filter(x => x !== t) : picked.concat(t).slice(-2);
  renderTypePick();
}

// ---------- game state ----------
const inst = c => ({ ...c, max: c.hp, energy: [], uid: Math.random() });
function newSide(types) {
  return { types, deck: buildDeck(types, CARDS, TRAINERS), hand: [], active: null, bench: [], discard: [], points: 0,
    energyNext: null, attached: false, supporter: false, retreated: false, bonus: 0, hotfix: 0 };
}
function draw(s, n = 1) { for (let i = 0; i < n && s.deck.length; i++) s.hand.push(s.deck.shift()); }
function log(s) { G.log.push(s); if (G.log.length > 3) G.log.shift(); }
const other = who => who === "me" ? "op" : "me";
const name = who => who === "me" ? "You" : "Opponent";

function start() {
  const opTypes = shuffle(Object.keys(TYPES)).slice(0, 1 + (Math.random() < .5 ? 1 : 0));
  G = { me: newSide(picked), op: newSide(opTypes), turn: 0, who: null, first: null, log: [], phase: "setup", after: null };
  for (const s of [G.me, G.op]) {
    do { s.deck = shuffle(s.deck); s.hand = s.deck.slice(0, 5); } while (!s.hand.some(c => c.sig)); // Pocket: a person is guaranteed in the opening hand
    s.deck = s.deck.slice(5);
  }
  G.first = Math.random() < .5 ? "me" : "op";
  // opponent setup: highest HP person active, the rest to the bench
  const people = G.op.hand.filter(c => c.sig).sort((a, b) => b.hp - a.hp);
  G.op.active = inst(people[0]); G.op.bench = people.slice(1, 4).map(inst);
  G.op.hand = G.op.hand.filter(c => !people.slice(0, 4).includes(c));
  log(`Coin flip: ${G.first === "me" ? "you go" : "opponent goes"} first. Opponent's deck: ${opTypes.map(typeOf).join(" + ")}.`);
  render();
}
function setupPick(i) { // choose starting active / bench from hand
  const c = G.me.hand[i]; if (!c.sig) return;
  if (!G.me.active) G.me.active = inst(c); else if (G.me.bench.length < 3) G.me.bench.push(inst(c)); else return;
  G.me.hand.splice(i, 1); render();
}
function begin() { G.phase = "play"; beginTurn(G.first); }

function beginTurn(who) {
  G.who = who; G.turn++;
  const s = G[who]; Object.assign(s, { attached: false, supporter: false, retreated: false, bonus: 0, hotfix: 0, shield: 0 });
  const opening = G.turn === 1;
  if (opening) { s.energyNext = null; log(`${name(who)} go${who === "me" ? "" : "es"} first: no draw, no energy this turn.`); }
  else { draw(s); s.energyNext = rnd(s.types); log(`${name(who)} drew a card. Energy Zone: ${icon(s.energyNext)}.`); }
  render();
  if (who === "op") setTimeout(aiTurn, 900);
}
function endTurn() {
  if (G.phase === "over") return;
  G[G.who].energyNext = null; // unattached energy is lost
  beginTurn(other(G.who));
}

// ---------- player actions ----------
const myTurn = () => G.who === "me" && G.phase === "play";
function playCard(i) {
  if (!myTurn()) return;
  const s = G.me, c = s.hand[i];
  if (c.sig) { if (!s.active) s.active = inst(c); else if (s.bench.length < 3) s.bench.push(inst(c)); else return; log(`You played ${c.name}.`); }
  else if (!applyTrainer("me", c)) return;
  s.hand.splice(i, 1); render();
}
function attach(i) { // i = -1 active, else bench index
  if (!myTurn()) return;
  const s = G.me; if (!s.energyNext || s.attached) return;
  const c = i < 0 ? s.active : s.bench[i]; c.energy.push(s.energyNext);
  log(`You attached ${icon(s.energyNext)} to ${c.name}.`); s.energyNext = null; s.attached = true; render();
}
function retreat(i) {
  if (!myTurn()) return;
  const s = G.me, cost = Math.max(0, (s.active.retreat ?? 1) - s.hotfix);
  if (s.retreated || s.active.energy.length < cost) return;
  s.active.energy.splice(0, cost);
  [s.active, s.bench[i]] = [s.bench[i], s.active]; s.retreated = true;
  log(`${s.bench[i].name} retreats. ${s.active.name} steps in.`); render();
}
function promote(i) {
  const s = G.me; s.active = s.bench.splice(i, 1)[0]; G.phase = "play";
  log(`${s.active.name} steps in.`);
  const f = G.after; G.after = null; f ? f() : render();
}
function attack(i) {
  if (!myTurn()) return;
  const s = G.me, m = moves(s.active)[i]; if (!canPay(s.active, m.cost)) return;
  resolve("me", m);
  if (G.phase === "over") return;
  if (!s.active) { G.phase = "promote"; G.after = endTurn; render(); } else endTurn();
}

// ---------- rules ----------
function resolve(who, m) {
  const A = G[who], D = G[other(who)], a = A.active, d = D.active;
  if (!a || !d) return;
  if (m.flip && Math.random() < .5) { log(`${a.name} used ${m.name}... tails. Nothing happens.`); return; }
  const r = damage(a, d, m, A.bonus), dmg = Math.max(0, r.dmg - (D.shield || 0)); d.hp = Math.max(0, d.hp - dmg);
  log(`${a.name} used ${m.name}! ${r.weak ? "Weakness, +20! " : ""}${A.bonus ? "+10! " : ""}${D.shield ? "Shielded, -20. " : ""}${dmg} damage.`);
  if (m.self) a.hp = Math.max(0, a.hp - m.self);
  if (m.heal) a.hp = Math.min(a.max, a.hp + m.heal);
  if (d.hp === 0) ko(other(who), who);
  if (a.hp === 0 && G.phase !== "over") ko(who, other(who));
}
function ko(loserWho, scorerWho) {
  const L = G[loserWho], S = G[scorerWho], c = L.active;
  L.discard.push(c); L.active = null; S.points += points(c);
  log(`${c.name} is knocked out! ${name(scorerWho)} get${scorerWho === "me" ? "" : "s"} ${points(c)} point${points(c) > 1 ? "s" : ""}.`);
  if (S.points >= 3) return gameOver(scorerWho, "3 points");
  if (!L.bench.length) return gameOver(scorerWho, `${name(loserWho).toLowerCase()} ${loserWho === "me" ? "have" : "has"} no cards left`);
  if (loserWho === "op") { L.bench.sort((x, y) => y.hp - x.hp); L.active = L.bench.shift(); log(`${L.active.name} steps in.`); }
  else G.phase = "promote";
}
function applyTrainer(who, t) {
  const s = G[who], o = G[other(who)];
  const heal = (c, n) => { if (!c || c.hp === c.max) return false; c.hp = Math.min(c.max, c.hp + n); return true; };
  const give = n => { for (let i = 0; i < n; i++) s.active.energy.push(rnd(s.types)); };
  if (t.kind === "supporter" && s.supporter) return false;
  if (!s.active) return false;
  let ok = true, note = "";
  switch (t.effect) {
    case "heal20": ok = heal(s.active, 20); break;
    case "heal50": ok = heal(s.active, 50); break;
    case "heal20all": ok = [s.active, ...s.bench].map(c => heal(c, 20)).some(Boolean); break;
    case "ball": { const i = s.deck.findIndex(c => c.sig); if (i < 0) ok = false; else s.hand.push(s.deck.splice(i, 1)[0]); break; }
    case "hotfix": s.hotfix = 1; break;
    case "retreatFree": s.hotfix = 9; break;
    case "draw2": ok = s.deck.length > 0; draw(s, 2); break;
    case "draw3": ok = s.deck.length > 0; draw(s, 3); break;
    case "plus10": s.bonus = 10; break;
    case "shield": s.shield = 20; break;
    case "energy": give(1); break;
    case "flipEnergy": { let n = 0; while (Math.random() < .5) n++; give(n); note = ` ${n} heads.`; break; }
    case "moveEnergy": ok = s.bench.some(c => c.energy.length); s.bench.forEach(c => { if (c.energy.length) s.active.energy.push(c.energy.pop()); }); break;
    case "sabrina": { if (!o.bench.length) { ok = false; break; } const i = Math.floor(Math.random() * o.bench.length); [o.active, o.bench[i]] = [o.bench[i], o.active]; note = ` ${o.active.name} is dragged in.`; break; }
    case "redcard": { o.deck = shuffle(o.deck.concat(o.hand)); o.hand = []; draw(o, 3); break; }
    case "dmg20": { o.active.hp = Math.max(0, o.active.hp - 20); break; }
  }
  if (!ok) return false;
  if (t.kind === "supporter") s.supporter = true;
  log(`${name(who)} played ${t.name}.${note}`);
  if (t.effect === "dmg20" && o.active.hp === 0) ko(other(who), who);
  return true;
}
function gameOver(who, why) { G.phase = "over"; G.winner = who; G.why = why; render(); }

// ---------- opponent AI ----------
function aiTurn() {
  const s = G.op, me = G.me, later = (f, ms) => setTimeout(() => { if (G.phase !== "over") f(); }, ms);
  // people to the field
  s.hand.filter(c => c.sig).sort((a, b) => b.hp - a.hp).forEach(c => {
    if (!s.active) s.active = inst(c); else if (s.bench.length < 3) s.bench.push(inst(c)); else return;
    s.hand.splice(s.hand.indexOf(c), 1); log(`Opponent played ${c.name}.`);
  });
  // items, then one supporter
  s.hand.filter(c => c.kind === "item").forEach(t => { if (t.effect === "hotfix") return; if (applyTrainer("op", t)) s.hand.splice(s.hand.indexOf(t), 1); });
  const ready = canPay(s.active, s.active.sig.cost), hurt = s.active.max - s.active.hp;
  const want = { heal50: hurt >= 50, heal20all: hurt >= 20, draw2: s.hand.length <= 2, draw3: s.hand.length <= 3, energy: !ready, flipEnergy: !ready,
    moveEnergy: !ready && s.bench.some(c => c.energy.length), plus10: ready, sabrina: me.bench.length > 0 && Math.random() < .3,
    shield: Math.random() < .5, redcard: me.hand.length >= 4, dmg20: true, retreatFree: false };
  const sup = s.hand.find(c => c.kind === "supporter" && want[c.effect]);
  if (sup && applyTrainer("op", sup)) s.hand.splice(s.hand.indexOf(sup), 1);
  if (G.phase === "over") return;
  // energy: active until it can use its signature, then the bench card closest to its signature, then active
  if (s.energyNext) {
    const target = !canPay(s.active, s.active.sig.cost) ? s.active : (s.bench.find(c => !canPay(c, c.sig.cost)) || s.active);
    target.energy.push(s.energyNext); log(`Opponent attached ${icon(s.energyNext)} to ${target.name}.`); s.energyNext = null; s.attached = true;
  }
  render();
  later(() => {
    if (me.active) {
      const best = moves(s.active).reduce((x, y) => ev(s.active, me.active, y, s.bonus) > ev(s.active, me.active, x, s.bonus) ? y : x);
      if (ev(s.active, me.active, best, s.bonus) > 0) resolve("op", best); else log("Opponent ends the turn.");
    }
    render();
    later(endTurn, 1100);
  }, 900);
}

// ---------- board ----------
function render() {
  if (G.phase === "over") {
    app.innerHTML = `<div class="over"><h1>${G.winner === "me" ? "You win!" : "You lose."}</h1><p class="log">${G.why}. ${G.log.at(-1)}</p>
      <p><button class="big" onclick="typePick()">Play Again</button> &nbsp; <button class="big alt" onclick="binder()">Find your card</button></p></div>`;
    return;
  }
  const me = G.me, op = G.op, mine = myTurn();
  if (G.phase === "setup") {
    app.innerHTML = `<h2>${me.active ? "Bench up to 3 more, or start" : "Choose your active card"}</h2><p class="hint">Click a person in your hand. ${G.log[0]}</p>
      <div class="row">${me.active ? cardHTML(me.active, { cls: "active" }) : "<p>—</p>"}<div class="bench">${me.bench.map(c => cardHTML(c, { cls: "mini" })).join("")}</div></div>
      <div class="hand">${me.hand.map((c, i) => c.sig ? cardHTML(c, { cls: "mini pickable", onclick: `setupPick(${i})` }) : trainerHTML(c)).join("")}</div>
      <p><button class="big" onclick="begin()" ${me.active ? "" : "disabled"}>Start battle</button></p>`;
    return;
  }
  const canAttach = mine && me.energyNext && !me.attached;
  const rc = me.active ? Math.max(0, (me.active.retreat ?? 1) - me.hotfix) : 0;
  const canRetreat = mine && me.active && !me.retreated && me.active.energy.length >= rc && G.phase === "play";
  const benchSlot = (c, i) => `<div class="slot">${cardHTML(c, { cls: "mini" })}<div class="acts">
      ${G.phase === "promote" ? `<button onclick="promote(${i})">Step in</button>` : ""}
      ${canAttach ? `<button onclick="attach(${i})">＋${icon(me.energyNext)}</button>` : ""}
      ${canRetreat ? `<button onclick="retreat(${i})">Retreat (${rc})</button>` : ""}</div></div>`;
  app.innerHTML = `<div class="board">
    <div class="status">Opponent · <b>${dots(op.points)}</b> · hand ${op.hand.length} · deck ${op.deck.length} · ${op.types.map(icon).join("")}</div>
    <div class="row">${op.active ? cardHTML(op.active, { cls: "active" }) : ""}<div class="bench">${op.bench.map(c => cardHTML(c, { cls: "mini" })).join("")}</div></div>
    <div class="log">${G.log.map((l, i) => i < G.log.length - 1 ? `<small>${l}</small>` : l).join("")}</div>
    ${G.phase === "promote" ? `<h3>Your active card was knocked out — choose who steps in.</h3>` : ""}
    <div class="row">
      ${me.active ? `<div class="slot">${cardHTML(me.active, { cls: "active", attack: true, busy: !mine || G.phase !== "play" })}<div class="acts">${canAttach ? `<button onclick="attach(-1)">＋${icon(me.energyNext)}</button>` : ""}</div></div>` : ""}
      <div class="bench">${me.bench.map(benchSlot).join("")}</div>
    </div>
    <div class="status">You · <b>${dots(me.points)}</b> · deck ${me.deck.length} · ${me.supporter ? "supporter used" : "supporter available"}
      ${mine && G.phase === "play" ? ` · <button class="acts" onclick="endTurn()" style="font:13px system-ui;padding:4px 10px;border-radius:6px;border:0;background:#ffcc33;cursor:pointer">End turn</button>` : ` · <i>${G.phase === "promote" ? "" : "opponent's turn…"}</i>`}</div>
    <div class="hand">${handHTML(me, mine && G.phase === "play")}</div>
  </div>
  <div class="zone"><div>ENERGY ZONE</div>
    <div class="cur ${me.energyNext ? "" : "dim"}">${me.energyNext ? icon(me.energyNext) : "—"}</div>
    <div>${me.energyNext ? (me.attached ? "attached" : "click ＋ on a card") : (me.attached ? "attached this turn" : "next turn")} · deck types ${me.types.map(icon).join("")}</div></div>`;
}

// Holo pointer tracking (math from pokemon-cards-css Card.svelte, minus the springs).
document.addEventListener("pointermove", e => {
  const c = e.target.closest(".card"); if (!c) return;
  const r = c.getBoundingClientRect();
  const x = Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100));
  const y = Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100));
  c.classList.add("interacting");
  c.style.cssText = `--pointer-x:${x}%;--pointer-y:${y}%;--rotate-x:${-(x - 50) / 3.5}deg;--rotate-y:${(y - 50) / 3.5}deg;` +
    `--background-x:${37 + x * .26}%;--background-y:${33 + y * .34}%;--card-opacity:1`;
});
document.addEventListener("pointerout", e => {
  const c = e.target.closest(".card"); if (!c || c.contains(e.relatedTarget)) return;
  c.classList.remove("interacting");
  c.style.cssText = "";
});

title();
</script>
