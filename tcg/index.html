<!doctype html>
<meta charset="utf-8">
<title>Gauntlet TCG</title>
<link rel="stylesheet" href="holo.css">
<style>
  body { margin: 0; padding: 20px; background: #151820; color: #eee; font: 15px/1.3 system-ui, sans-serif; text-align: center; }
  h1 { font-size: 56px; margin: 60px 0 16px; }
  .big { font-size: 22px; padding: 12px 36px; border: 0; border-radius: 8px; background: #ffcc33; cursor: pointer; }
  .row { display: flex; justify-content: center; align-items: center; gap: 24px; flex-wrap: wrap; margin: 16px 0; }
  .bench { display: flex; gap: 8px; }
  .mini { zoom: .5; }
  .log { min-height: 1.5em; font-size: 20px; margin: 12px; } .log small { display: block; font-size: 13px; color: #777; }
  .who { color: #888; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; }
  .pickable { cursor: pointer; }
  .n { position: absolute; top: -10px; left: -10px; width: 28px; height: 28px; border-radius: 50%; background: #ffcc33; color: #000; display: grid; place-items: center; z-index: 9; }

  /* card face */
  .card { position: relative; }
  .face { height: 100%; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: left; color: #222;
    background: linear-gradient(160deg, var(--c1), var(--c2)); border: 8px solid #f3e9b8; border-radius: inherit; }
  .card.fire     { --c1: #ffb26b; --c2: #e0442e; }
  .card.water    { --c1: #8fd8ff; --c2: #1e7fd8; }
  .card.grass    { --c1: #b8ee8c; --c2: #3f9e3a; }
  .card.electric { --c1: #fff3a0; --c2: #e8b800; }
  .card.psychic  { --c1: #e2b6ff; --c2: #8a3fc8; }
  .card.fighting { --c1: #f0c8a0; --c2: #a86428; }
  .hd { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; white-space: nowrap; } .hd span + span { font-size: 12px; }
  .bar { height: 6px; background: #0003; border-radius: 3px; } .bar i { display: block; height: 100%; background: #2ecc40; border-radius: 3px; }
  .pic { width: 100%; height: 112px; border-radius: 6px; background: #fff6; border: 3px solid #fff8; box-sizing: border-box; display: grid; place-items: center;
    font-size: 40px; font-weight: 800; position: relative; overflow: hidden; }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .type { font-size: 12px; text-align: center; margin-top: -2px; }
  .atk { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 5px 8px; border: 0; border-radius: 6px;
    background: #fff9; font: inherit; width: 100%; text-align: left; }
  .atk small { display: block; font-size: 10px; color: #555; }
  button.atk { cursor: pointer; } button.atk:hover:not(:disabled) { background: #fff; } button.atk:disabled { opacity: .5; cursor: default; }
  .weak { font-size: 11px; }
  .alt { background: #8fd8ff; }
  .hint { color: #888; font-size: 13px; } .hint a { color: #ffcc33; }
  .op { opacity: .9; }
  .flavor { font-size: 11px; font-style: italic; color: #333; margin-top: auto; }
</style>

<div id="app"></div>

<script src="cards.js"></script>
<script src="battle.js"></script>
<script>
const LABEL = { fire: "Frontend", water: "Data", grass: "ML", electric: "Infra", psychic: "Agents", fighting: "Evals" };
const ICON = { fire: "🔥", water: "💧", grass: "🌿", electric: "⚡", psychic: "🔮", fighting: "🥊" };
const app = document.getElementById("app");
const shuffle = a => a.slice().sort(() => Math.random() - .5); // ponytail: biased shuffle, fine for 29 cards
const typeOf = t => `${ICON[t]} ${LABEL[t]}`;
let S;

// o: { cls, onclick, badge, attack (render attacks as buttons), busy (disable them) }
function cardHTML(c, o = {}) {
  const max = c.max || c.hp;
  const initials = c.name.split(" ").map(w => w[0]).join("").slice(0, 2);
  const atks = c.attacks.map((a, i) => {
    const rider = [a.flip ? "🪙 coin flip" : "", a.text || ""].filter(Boolean).join(" · ");
    const inner = `<span>${a.name}${rider ? `<small>${rider}</small>` : ""}</span><b>${a.dmg}</b>`;
    return o.attack ? `<button class="atk" onclick="attack(${i})" ${o.busy ? "disabled" : ""}>${inner}</button>` : `<div class="atk">${inner}</div>`;
  }).join("");
  return `<div class="card ${c.type} ${o.cls || ""}" ${o.onclick ? `onclick="${o.onclick}"` : ""}>
    ${o.badge ? `<b class="n">${o.badge}</b>` : ""}
    <div class="card__rotator">
      <div class="card__front"><div class="face">
        <div class="hd"><span>${c.name}</span><span>${c.hp}/${max} HP</span></div>
        <div class="bar"><i style="width:${c.hp / max * 100}%"></i></div>
        <div class="pic">${initials}${c.photo ? `<img src="${c.photo}" alt="" onerror="this.remove()">` : ""}</div>
        <div class="type">${typeOf(c.type)}</div>
        ${atks}
        <div class="weak">weak to ${typeOf(WEAK[c.type])} (2x)</div>
        <div class="flavor">${c.flavor}</div>
      </div></div>
      <div class="card__shine"></div>
      <div class="card__glare"></div>
    </div>
  </div>`;
}

function title() {
  app.innerHTML = `<h1>Gauntlet TCG</h1><p>Cohort 6 as a card game. Draft 3. Exploit weaknesses. Ship before midnight.</p>
    <p><button class="big" onclick="draft()">Play</button> &nbsp; <button class="big alt" onclick="binder()">Find your card</button></p>
    <p class="hint">${CARDS.length} cards · hover to tilt</p>`;
}
function binder() {
  app.innerHTML = `<h2>The Binder</h2><p class="hint"><a href="#" onclick="title();return false">← Back</a> · all ${CARDS.length} cards, in Guess Who order</p>
    <div class="row">${CARDS.map(c => cardHTML(c)).join("")}</div>`;
}

function draft() {
  const deck = shuffle(CARDS);
  S = { op: deck.slice(0, 3), pool: deck.slice(3, 9), picks: [] };
  renderDraft();
}
function renderDraft() {
  app.innerHTML = `<div class="who">Opponent's team</div><div class="row op">${S.op.map(c => cardHTML(c, { cls: "mini" })).join("")}</div>
    <h2>Draft: pick 3 (${S.picks.length}/3). First pick leads.</h2><p class="hint">Weakness = double damage. Counter their types.</p>
    <div class="row">${S.pool.map((c, i) => cardHTML(c, { cls: "pickable " + (S.picks.includes(i) ? "active" : ""), onclick: `pick(${i})`, badge: S.picks.indexOf(i) + 1 || "" })).join("")}</div>`;
}
function pick(i) {
  S.picks = S.picks.includes(i) ? S.picks.filter(p => p !== i) : S.picks.concat(i);
  S.picks.length === 3 ? battle() : renderDraft();
}

function battle() {
  S.me = S.picks.map(i => ({ ...S.pool[i], max: S.pool[i].hp }));
  S.op = S.op.map(c => ({ ...c, max: c.hp }));
  S.prev = "";
  const first = Math.random() < .5;
  S.busy = !first;
  S.log = first ? "Coin flip: you go first. Pick an attack, or click a bench card to switch." : "Coin flip: opponent goes first.";
  renderBattle();
  if (!first) opTurn();
}
function renderBattle() {
  const side = (team, mine) => `<div class="row">
    ${cardHTML(team[0], { cls: "active", attack: mine, busy: S.busy })}
    <div class="bench">${team.slice(1).map((c, i) => cardHTML(c, { cls: "mini" + (mine && !S.busy ? " pickable" : ""), onclick: mine ? `swap(${i + 1})` : "" })).join("")}</div>
  </div>`;
  app.innerHTML = `<div class="who">Opponent</div>${side(S.op, false)}<div class="log"><small>${S.prev || ""}</small>${S.log}</div>${side(S.me, true)}
    <div class="who">You · click a bench card to switch (uses your turn)</div>`;
}

// att/def are teams; index 0 is active. Mutates hp, shifts out KO'd cards, returns the log line.
function hit(att, def, atk) {
  S.prev = S.log;
  const a = att[0], d = def[0];
  if (atk.flip && Math.random() < .5) return `${a.name} used ${atk.name}... tails. Nothing happens.`;
  const r = damage(a, d, atk);
  d.hp = r.hp;
  if (atk.self) a.hp = Math.max(0, a.hp - atk.self);
  let s = `${a.name} used ${atk.name}! ${r.super ? "It's super effective! " : ""}${r.dmg} dmg.`;
  if (d.hp === 0) { def.shift(); s += ` ${d.name} is knocked out!`; if (def[0]) s += ` ${def[0].name} steps in.`; }
  if (a.hp === 0) { att.shift(); s += ` ${a.name} took themselves down with it.`; }
  return s;
}
function attack(i) {
  if (S.busy) return;
  S.busy = true;
  S.log = hit(S.me, S.op, S.me[0].attacks[i]);
  if (end()) return;
  renderBattle();
  opTurn();
}
function swap(i) {
  if (S.busy) return;
  S.busy = true; S.prev = S.log;
  [S.me[0], S.me[i]] = [S.me[i], S.me[0]];
  S.log = `${S.me[0].name} steps in.`;
  renderBattle();
  opTurn();
}
function opTurn() {
  setTimeout(() => {
    const op = S.op[0];
    const best = op.attacks.reduce((x, y) => ev(op, S.me[0], y) > ev(op, S.me[0], x) ? y : x);
    S.log = hit(S.op, S.me, best);
    S.busy = false;
    if (!end()) renderBattle();
  }, 1200);
}
function end() {
  if (S.op.length && S.me.length) return false;
  app.innerHTML = `<h1>${S.me.length ? "You win!" : "You lose."}</h1><p class="log">${S.log}</p>
    <p><button class="big" onclick="draft()">Play Again</button> &nbsp; <button class="big alt" onclick="binder()">Find your card</button></p>`;
  return true;
}

// Holo pointer tracking (math from pokemon-cards-css Card.svelte, minus the springs).
document.addEventListener("pointermove", e => {
  const c = e.target.closest(".card"); if (!c) return;
  const r = c.getBoundingClientRect();
  const x = Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100));
  const y = Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100));
  c.classList.add("interacting");
  c.style.cssText = `--pointer-x:${x}%;--pointer-y:${y}%;--rotate-x:${-(x - 50) / 3.5}deg;--rotate-y:${(y - 50) / 3.5}deg;` +
    `--background-x:${37 + x * .26}%;--background-y:${33 + y * .34}%;--card-opacity:1`;
});
document.addEventListener("pointerout", e => {
  const c = e.target.closest(".card"); if (!c || c.contains(e.relatedTarget)) return;
  c.classList.remove("interacting");
  c.style.cssText = "";
});

title();
</script>
